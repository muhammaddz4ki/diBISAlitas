name: dibisalitas
description: "diBISAlitas - Aplikasi Pendamping Inklusif Berbasis AI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_messaging: ^16.4.1

  # State Management & Navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Maps (OpenStreetMap - 100% GRATIS)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Location & Sensors
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  sensors_plus: ^6.1.1
  vibration: ^2.0.1

  # Camera & ML
  camera: ^0.10.5
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # UI & Utilities
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  intl: ^0.19.0
  uuid: ^4.5.1
  http: ^1.2.2
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_tts: ^4.2.5
  google_sign_in: ^6.2.1
  crypto: ^3.0.7
  speech_to_text: ^7.4.0
  tflite_flutter: ^0.12.1
  image: ^4.8.0
  provider: ^6.1.5+1
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/logo/
    - assets/Machine Learning/
